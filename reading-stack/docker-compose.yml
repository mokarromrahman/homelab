services:
  # --- PROTONVPN (via Gluetun) ---
  vpn:
    image: qmcgaw/gluetun:v3
    container_name: protonvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
      - SERVER_COUNTRIES=Canada
    ports:
      - "8080:8080" # qBittorrent WebUI
      - "6881:6881" # Torrent transfer
      - "6881:6881/udp"
    restart: unless-stopped

  # --- QBITTORRENT (Routed through VPN) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Edmonton
      - WEBUI_PORT=8080
    volumes:
      - ./appdata/qbittorrent:/config
      - ../data:/data # Steps out of reading-stack to access the global homelab data folder
    depends_on:
      - vpn
    restart: unless-stopped

  # --- PROWLARR (Manual Indexer Search) ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Edmonton
    volumes:
      - ./appdata/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  # --- SUWAYOMI (Manga Downloader Server) ---
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:latest
    container_name: suwayomi
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Edmonton
    volumes:
      - ./appdata/suwayomi:/etc/suwayomi
      # CHANGE THIS LINE TO MATCH SUWAYOMI'S INTERNAL ARCHITECTURE:
      - ../data/manga:/home/suwayomi/.local/share/Tachidesk/downloads
    ports:
      - "4567:4567"
    restart: unless-stopped

  # --- KAVITA (The Shared Media Reader) ---
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Edmonton
    volumes:
      - ../data:/manga # Kavita watches the root data directory for books, comics, and manga
      - ./appdata/kavita:/kavita/config
    ports:
      - "5000:5000"
    restart: unless-stopped
