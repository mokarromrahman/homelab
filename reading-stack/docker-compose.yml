services:
  # 1. THE VPN GATEWAY (Gluetun)
  reading-vpn:
    image: qmcgaw/gluetun
    container_name: reading-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/reading-config/gluetun:/tmp/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
      - UPDATER_PERIOD=24h
    ports:
      - 8040:8040 # qBittorrent Web UI
      - 5000:5000 # Kavita Web UI
    restart: unless-stopped

  # 2. THE DOWNLOADER (Routed through VPN)
  reading-qbit:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: reading-qbit
    network_mode: "service:reading-vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8040
      - TZ=America/Edmonton
    volumes:
      - /srv/reading-config/qbittorrent:/config
      - /srv/reading:/data
    restart: unless-stopped
    depends_on:
      - reading-vpn

  # 3. BOOK MANAGEMENT (Normal Network - Swapped to stable Binhex image)
  readarr:
    image: binhex/arch-readarr:latest
    container_name: readarr
    ports:
      - 8787:8787
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Edmonton
    volumes:
      - /srv/reading-config/readarr:/config
      - /srv/reading:/data
    restart: unless-stopped



  # 4. COMIC/MANGA MANAGEMENT (Normal Network)
  mylar:
    image: lscr.io/linuxserver/mylar3:latest
    container_name: mylar3
    ports:
      - 8090:8090
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Edmonton
    volumes:
      - /srv/reading-config/mylar:/config
      - /srv/reading:/data
    restart: unless-stopped

  # 5. THE READING APP (Kavita)
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    network_mode: "service:reading-vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Edmonton
    volumes:
      - /srv/reading-config/kavita:/config
      - /srv/reading:/data
    restart: unless-stopped
    depends_on:
      - reading-vpn