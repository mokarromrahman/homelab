services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: vpn-gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /Volume1/Docker/gluetun:/tmp/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
      - UPDATER_PERIOD=24h
    ports:
      - 8080:8080 # qBittorrent Web UI
      - 9696:9696 # Prowlarr Web UI
      - 7878:7878 # Radarr Web UI (Moved here)
      - 8989:8989 # Sonarr Web UI (Moved here)
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=0
      - PGID=997
      - WEBUI_PORT=8080
      - TZ=America/Edmonton
    volumes:
      - /Volume1/Docker/qbittorrent:/config
      - /Volume1/Media:/data
    restart: unless-stopped
    depends_on:
      - gluetun

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=0
      - PGID=997
      - TZ=America/Edmonton
    volumes:
      - /Volume1/Docker/prowlarr:/config
    restart: unless-stopped
    depends_on:
      - gluetun

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    environment:
      - PUID=0
      - PGID=997
      - TZ=America/Edmonton
    volumes:
      - /Volume1/Docker/radarr:/config
      - /Volume1/Media:/data
    restart: unless-stopped
    depends_on:
      - gluetun

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    environment:
      - PUID=0
      - PGID=997
      - TZ=America/Edmonton
    volumes:
      - /Volume1/Docker/sonarr:/config
      - /Volume1/Media:/data
    restart: unless-stopped
    depends_on:
      - gluetun

  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    network_mode: "service:gluetun"
    volumes:
      - /Volume1/Media:/data
    environment:
      - TZ=America/Edmonton
      - UN_SONARR_0_URL=http://localhost:8989
      - UN_SONARR_0_API_KEY=${UN_SONARR_0_API_KEY}
      - UN_RADARR_0_URL=http://localhost:7878
      - UN_RADARR_0_API_KEY=${UN_RADARR_0_API_KEY}
      - UN_DEFAULT_EXTRACT_LIMIT=100GB
    restart: unless-stopped
    depends_on:
      - gluetun